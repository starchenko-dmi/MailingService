{% extends "users/base_auth.html" %}
{% block title %}Сброс пароля{% endblock %}

{% block content %}
<h2>Сброс пароля</h2>
<p>Введите ваш email, и мы вышлем инструкции по восстановлению пароля.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Отправить инструкции</button>
</form>

<a href="{% url 'users:login' %}" class="btn btn-secondary mt-2">Назад к входу</a>
{% endblock %}
