{% extends "mailing/base.html" %}
{% block content %}
<h2>Сообщения</h2>
<a href="{% url 'mailing:message_create' %}" class="btn btn-primary mb-3">Добавить сообщение</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Тема</th>
            <th>Тело письма</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for message in messages %}
        <tr>
            <td>{{ message.subject }}</td>
            <td>{{ message.body|truncatewords:15 }}</td>
            <td>
                <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-sm btn-outline-warning">Изменить</a>
                <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Нет сообщений</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
