{% extends "mailing/base.html" %}

{% block title %}{{ verbose_name|title }} — {{ action }}{% endblock %}

{% block content %}
<h2>{{ action }} {{ verbose_name }}</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        {{ form.as_p }}
    </div>
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{{ view.success_url }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
