{% extends "mailing/base.html" %}
{% block content %}
<h2>Получатели</h2>
<a href="{% url 'mailing:client_create' %}" class="btn btn-primary mb-3">Добавить клиента</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Email</th>
            <th>Ф. И. О.</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for client in clients %}
        <tr>
            <td>{{ client.email }}</td>
            <td>{{ client.full_name }}</td>
            <td>
                <a href="{% url 'mailing:client_update' client.pk %}" class="btn btn-sm btn-outline-warning">Изменить</a>
                <a href="{% url 'mailing:client_delete' client.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Нет получателей</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
